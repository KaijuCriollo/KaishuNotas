<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121311">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kaishu">
<title>Kaishu Notas</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#121311;
    --surface:#1D1F1C;
    --surface-2:#262924;
    --line:#30332D;
    --text:#ECEDE8;
    --muted:#A3A59E;
    --accent:#8EA6FF;
    --accent-ink:#0E1430;
    --old:#F2A777;
    --old-bg:rgba(242,167,119,.18);
    --done:#6FD39A;
    --done-ink:#0C2416;
    --danger:#FF8A80;
    --danger-ink:#2A0B08;
    --card-a:.45;
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    background:var(--bg);color:var(--text);
    font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
    font-size:16px;line-height:1.35;
  }
  button,input{font:inherit;color:inherit}
  button{cursor:pointer}

  /* Fondo personalizado */
  .bg,.shade{position:fixed;inset:0;z-index:0;pointer-events:none}
  .bg{background-size:cover;background-position:center;display:none}
  .shade{background:#000;opacity:0;display:none}
  body.has-bg .bg,body.has-bg .shade{display:block}
  body.has-bg h1,body.has-bg .date,body.has-bg h2,body.has-bg .sec-meta,body.has-bg .progress-row,body.has-bg .cover-list,body.has-bg .big,body.has-bg .hint-swipe{text-shadow:0 1px 10px rgba(0,0,0,.55)}
  body.has-bg .card{background:rgba(29,31,28,var(--card-a));-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-color:rgba(255,255,255,.1)}
  body.has-bg .done-item{background:rgba(18,19,17,calc(var(--card-a) * .6))}
  body.has-bg .composer{background:rgba(18,19,17,calc(var(--card-a) + .2));-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}

  /* Páginas deslizables */
  .pager{position:relative;z-index:1;height:100vh;height:100dvh;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
  .pager::-webkit-scrollbar{display:none}
  .page{flex:0 0 100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;overscroll-behavior-y:contain;display:flex;flex-direction:column}
  .inner{width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;flex:1}

  .dots{position:fixed;z-index:3;left:50%;transform:translateX(-50%);top:calc(var(--safe-t) + 10px);display:flex;gap:4px}
  .dot{width:32px;height:24px;border:0;background:transparent;padding:0;display:flex;align-items:center;justify-content:center}
  .dot::before{content:"";width:7px;height:7px;border-radius:999px;background:rgba(236,237,232,.35);transition:.2s}
  .dot[aria-current="true"]::before{width:20px;background:var(--text)}

  .settings-btn{position:fixed;z-index:3;top:calc(var(--safe-t) + 26px);right:max(20px,calc((100vw - 560px)/2 + 20px));width:44px;height:44px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:rgba(29,31,28,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center}

  header{padding:calc(var(--safe-t) + 30px) 20px 8px;display:flex;flex-direction:column;gap:14px}
  .date{font-size:14px;color:var(--muted);margin-bottom:2px}
  h1{margin:0;font-size:32px;font-weight:700;letter-spacing:-.5px;padding-right:56px}
  .progress-row{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
  .bar{height:8px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:6px}
  .bar>div{height:100%;width:0;border-radius:999px;background:var(--done);transition:width .35s ease}

  /* Portada */
  .cover{flex:1;padding:8px 20px calc(28px + var(--safe-b));display:flex;flex-direction:column;gap:22px}
  .big{display:flex;align-items:baseline;gap:10px;margin-top:12px}
  .big strong{font-size:52px;line-height:1;font-weight:700;letter-spacing:-1.5px}
  .big span{font-size:18px;color:var(--muted)}
  .fold{border-radius:16px;background:rgba(29,31,28,var(--card-a));border:1px solid rgba(255,255,255,.1);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .fold summary{list-style:none;min-height:52px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;font-weight:500}
  .fold summary::-webkit-details-marker{display:none}
  .fold summary svg{transition:transform .2s;flex:none}
  .fold[open] summary svg{transform:rotate(180deg)}
  .fold .cover-list{padding:4px 16px 16px;font-size:16px}
  .fold.is-empty{display:none}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font-size:14px;font-weight:500;border-radius:999px;padding:7px 12px;background:rgba(29,31,28,.6);border:1px solid rgba(255,255,255,.1)}
  .chip.old{color:var(--old)}
  .chip.done{color:var(--done)}
  .cover-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:18px}
  .cover-list li{display:flex;align-items:center;gap:12px}
  .cover-list li::before{content:"";width:8px;height:8px;flex:none;border-radius:999px;background:var(--muted)}
  .cover-list li.is-old::before{background:var(--old)}
  .cover-list .more{color:var(--muted);font-size:15px}
  .cover-list .more::before{display:none}
  .hint-swipe{margin-top:auto;border:0;background:transparent;color:var(--muted);font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px}

  /* Lista */
  main{flex:1;padding:10px 20px 20px;display:flex;flex-direction:column;gap:22px}
  section{display:flex;flex-direction:column;gap:10px}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;padding:0 2px}
  h2{margin:0;font-size:13px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
  .sec-old h2{color:var(--old)}
  .sec-done h2{color:var(--done)}
  .sec-meta{font-size:12px;color:var(--muted)}
  ul.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 6px 8px 14px;min-height:58px;display:flex;align-items:center;gap:12px;animation:in .2s ease}
  @keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .check{width:30px;height:30px;flex:none;border-radius:9px;border:2px solid #8A8D85;background:transparent;padding:0;display:flex;align-items:center;justify-content:center;position:relative}
  .check::after{content:"";position:absolute;inset:-8px}
  .sec-old .check{border-color:var(--old)}
  .text{flex:1;min-width:0;overflow-wrap:anywhere}
  .badge{flex:none;font-size:12px;font-weight:700;color:var(--old);background:var(--old-bg);border-radius:999px;padding:4px 9px;white-space:nowrap}
  .trash{width:40px;height:40px;flex:none;border:0;border-radius:12px;background:transparent;color:#8A8D85;display:flex;align-items:center;justify-content:center}
  .trash:active{background:rgba(255,138,128,.15);color:var(--danger)}

  .done-item{background:transparent;border-color:transparent}
  .done-item .check{background:var(--done);border-color:var(--done);color:var(--done-ink)}
  .done-item .text{color:var(--muted);text-decoration:line-through}

  .empty{text-align:center;padding:48px 16px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted)}
  .empty strong{color:var(--text);font-size:18px;font-weight:500}

  .composer{position:sticky;bottom:0;z-index:2;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + var(--safe-b))}
  .composer form{max-width:528px;margin:0 auto;display:flex;gap:8px}
  .composer input{flex:1;min-width:0;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);padding:0 16px;font-size:16px}
  .composer input::placeholder{color:#8A8D85}
  .composer input:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .add{width:50px;height:50px;flex:none;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* Hojas (ajustes y confirmación) */
  dialog{border:0;padding:0;background:transparent;color:var(--text);max-width:none;width:100%;margin:auto 0 0;inset:auto 0 0 0}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  .sheet{background:var(--surface);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:10px 20px calc(20px + var(--safe-b));max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
  .grab{width:40px;height:5px;border-radius:999px;background:var(--line);margin:0 auto 4px}
  .sheet h3{margin:0;font-size:20px;overflow-wrap:anywhere}
  .preview{height:120px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;overflow:hidden;position:relative}
  .preview .pshade{position:absolute;inset:0;background:#000}
  .preview .pcard{position:relative;border-radius:12px;padding:10px 14px;font-size:14px;color:var(--text);background:rgba(29,31,28,var(--card-a));border:1px solid rgba(255,255,255,.1);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .row-btns{display:flex;gap:10px}
  .btn{flex:1;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-weight:500}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
  .btn.danger{background:var(--danger);border-color:var(--danger);color:var(--danger-ink);font-weight:700}
  .btn:disabled{opacity:.45}
  .range label{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:6px}
  input[type=range]{width:100%;accent-color:var(--accent);height:28px;margin:0}
  .hint{font-size:13px;color:var(--muted);margin:0}
  .steps{display:flex;gap:6px}
  .steps span{flex:1;height:5px;border-radius:999px;background:var(--line)}
  .steps span.on{background:var(--danger)}
  .confirm-txt{margin:0;color:var(--muted)}

  .toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translateX(-50%) translateY(10px);opacity:0;z-index:5;background:#ECEDE8;color:#121311;border-radius:12px;padding:10px 16px;font-size:14px;font-weight:500;transition:.2s;pointer-events:none;max-width:calc(100% - 32px)}
  .toast.show{opacity:1;transform:translateX(-50%)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<div class="shade" id="shade"></div>

<nav class="dots" aria-label="Pantallas">
  <button class="dot" data-go="0" aria-label="Resumen" aria-current="true"></button>
  <button class="dot" data-go="1" aria-label="Lista de pendientes" aria-current="false"></button>
</nav>
<button class="settings-btn" id="openSettings" aria-label="Ajustes de fondo">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-5-5L5 21"></path></svg>
</button>

<div class="pager" id="pager">
  <!-- Pantalla 1: resumen -->
  <div class="page" id="p0">
    <div class="inner">
      <header>
        <div>
          <div class="date js-date"></div>
          <h1>Kaishu Notas</h1>
        </div>
      </header>
      <div class="cover">
        <div class="big"><strong id="bigNum">0</strong><span id="bigLbl">pendientes</span></div>
        <div class="chips" id="chips"></div>
        <details class="fold" id="fold">
          <summary><span id="foldLbl">Ver pendientes</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></summary>
          <ul class="cover-list" id="coverList"></ul>
        </details>
        <button class="hint-swipe" type="button" data-go="1">
          Deslizá para ver y editar
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Pantalla 2: lista -->
  <div class="page" id="p1">
    <div class="inner">
      <header>
        <div>
          <div class="date js-date"></div>
          <h1>Pendientes</h1>
        </div>
        <div>
          <div class="progress-row"><span id="progressLabel"></span><span id="pct"></span></div>
          <div class="bar" role="progressbar" aria-label="Progreso del día" aria-valuemin="0" aria-valuemax="100" id="barWrap"><div id="bar"></div></div>
        </div>
      </header>
      <main id="list"></main>
    </div>
    <div class="composer">
      <form id="form" autocomplete="off">
        <label for="nuevo" class="sr">Nuevo pendiente</label>
        <input id="nuevo" placeholder="Anotar algo…" maxlength="200" enterkeyhint="done">
        <button class="add" type="submit" aria-label="Agregar pendiente">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        </button>
      </form>
    </div>
  </div>
</div>

<dialog id="settings" aria-labelledby="settingsTitle">
  <div class="sheet">
    <div class="grab" aria-hidden="true"></div>
    <h3 id="settingsTitle">Fondo</h3>
    <div class="preview" id="preview"><div class="pshade" id="pshade"></div><span id="previewTxt" style="position:relative">Sin imagen</span><div class="pcard" id="pcard">Así se ve una nota</div></div>
    <div class="row-btns">
      <button class="btn primary" id="pickBtn" type="button">Elegir imagen</button>
      <button class="btn" id="removeBtn" type="button">Quitar</button>
    </div>
    <div class="range">
      <label for="dim"><span>Oscurecer imagen</span><span id="dimVal"></span></label>
      <input type="range" id="dim" min="0" max="85" step="5">
    </div>
    <div class="range">
      <label for="alpha"><span>Opacidad de las notas</span><span id="alphaVal"></span></label>
      <input type="range" id="alpha" min="10" max="95" step="5">
    </div>
    <p class="hint">La imagen y tus pendientes se guardan solo en este teléfono.</p>
    <button class="btn" id="closeSettings" type="button">Listo</button>
  </div>
</dialog>

<dialog id="confirm" aria-labelledby="confirmTitle">
  <div class="sheet">
    <div class="grab" aria-hidden="true"></div>
    <div class="steps" aria-hidden="true"><span></span><span></span><span></span></div>
    <h3 id="confirmTitle"></h3>
    <p class="confirm-txt" id="confirmTxt"></p>
    <div class="row-btns" id="confirmBtns"></div>
  </div>
</dialog>

<input type="file" id="file" accept="image/*" class="sr" tabindex="-1" aria-hidden="true">
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const KEY = 'kaishu.items.v1', HIST = 'kaishu.history.v1', BG = 'kaishu.bg', DIM = 'kaishu.dim', ALPHA = 'kaishu.alpha';
  const $ = (id) => document.getElementById(id);

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  const readJSON = (k) => { try { return JSON.parse(store.get(k, '[]')) || []; } catch (e) { return []; } };

  const pad = (n) => String(n).padStart(2, '0');
  const ymd = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const today = () => ymd(new Date());
  const daysBetween = (a, b) => {
    const [y1, m1, d1] = a.split('-').map(Number), [y2, m2, d2] = b.split('-').map(Number);
    return Math.round((Date.UTC(y2, m2 - 1, d2) - Date.UTC(y1, m1 - 1, d1)) / 86400000);
  };

  let items = readJSON(KEY);
  function save() { if (!store.set(KEY, JSON.stringify(items))) toast('No se pudo guardar en este teléfono'); }

  // Lo completado en días anteriores sale de la lista y pasa al historial (para la vista semanal futura)
  function cleanup() {
    const t = today();
    const old = items.filter((i) => i.doneOn && i.doneOn < t);
    if (!old.length) return;
    const limit = (() => { const d = new Date(); d.setDate(d.getDate() - 60); return ymd(d); })();
    const hist = readJSON(HIST).concat(old.map((i) => ({ text: i.text, created: i.created, doneOn: i.doneOn })))
      .filter((h) => h.doneOn >= limit);
    store.set(HIST, JSON.stringify(hist));
    items = items.filter((i) => !(i.doneOn && i.doneOn < t));
    save();
  }

  function renderDate() {
    const s = new Intl.DateTimeFormat('es-AR', { weekday: 'long', day: 'numeric', month: 'long' }).format(new Date()).replace(',', '');
    const txt = s.charAt(0).toUpperCase() + s.slice(1);
    document.querySelectorAll('.js-date').forEach((el) => { el.textContent = txt; });
  }

  const checkSvg = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>';
  const trashSvg = '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"></path></svg>';

  function row(item, kind, t) {
    const li = document.createElement('li');
    li.className = 'card' + (kind === 'done' ? ' done-item' : '');
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'check';
    b.setAttribute('aria-label', kind === 'done' ? 'Desmarcar: ' + item.text : 'Marcar como hecho: ' + item.text);
    if (kind === 'done') b.innerHTML = checkSvg;
    b.addEventListener('click', () => toggle(item.id));
    const span = document.createElement('span');
    span.className = 'text';
    span.textContent = item.text;
    li.append(b, span);
    if (kind === 'old') {
      const d = daysBetween(item.created, t);
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = d === 1 ? 'desde ayer' : 'hace ' + d + ' días';
      li.append(badge);
    }
    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'trash';
    del.innerHTML = trashSvg;
    del.setAttribute('aria-label', 'Eliminar: ' + item.text);
    del.addEventListener('click', () => askDelete(item));
    li.append(del);
    return li;
  }

  function section(cls, title, meta, list, kind, t) {
    const s = document.createElement('section');
    s.className = cls;
    const h = document.createElement('div');
    h.className = 'sec-head';
    h.innerHTML = '<h2></h2><span class="sec-meta"></span>';
    h.querySelector('h2').textContent = title;
    h.querySelector('.sec-meta').textContent = meta;
    const ul = document.createElement('ul');
    ul.className = 'items';
    list.forEach((i) => ul.append(row(i, kind, t)));
    s.append(h, ul);
    return s;
  }

  function render() {
    cleanup();
    renderDate();
    const t = today();
    const pending = items.filter((i) => !i.doneOn);
    const old = pending.filter((i) => i.created < t).sort((a, b) => a.created.localeCompare(b.created) || a.id - b.id);
    const fresh = pending.filter((i) => i.created >= t).sort((a, b) => a.id - b.id);
    const done = items.filter((i) => i.doneOn).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));

    // Portada
    $('bigNum').textContent = pending.length;
    $('bigLbl').textContent = pending.length === 1 ? 'pendiente' : 'pendientes';
    const chips = $('chips');
    chips.replaceChildren();
    const chip = (cls, txt) => { const c = document.createElement('span'); c.className = 'chip ' + cls; c.textContent = txt; chips.append(c); };
    if (old.length) chip('old', old.length + (old.length === 1 ? ' arrastrado' : ' arrastrados'));
    if (fresh.length) chip('', fresh.length + (fresh.length === 1 ? ' nuevo' : ' nuevos'));
    if (done.length) chip('done', done.length + (done.length === 1 ? ' hecho hoy' : ' hechos hoy'));
    const cl = $('coverList');
    cl.replaceChildren();
    const MAX = 6;
    old.concat(fresh).slice(0, MAX).forEach((i) => {
      const li = document.createElement('li');
      if (i.created < t) li.className = 'is-old';
      li.textContent = i.text;
      cl.append(li);
    });
    if (pending.length > MAX) {
      const li = document.createElement('li');
      li.className = 'more';
      li.textContent = '+ ' + (pending.length - MAX) + ' más';
      cl.append(li);
    }
    $('fold').classList.toggle('is-empty', !pending.length);

    // Lista
    const total = pending.length + done.length;
    const pct = total ? Math.round(done.length * 100 / total) : 0;
    $('progressLabel').textContent = total ? done.length + ' de ' + total + ' hechos hoy' : 'Sin pendientes';
    $('pct').textContent = pct + '%';
    $('bar').style.width = pct + '%';
    $('barWrap').setAttribute('aria-valuenow', pct);

    const main = $('list');
    main.replaceChildren();
    if (old.length) main.append(section('sec-old', 'Arrastrados', String(old.length), old, 'old', t));
    if (fresh.length) main.append(section('sec-new', old.length ? 'Nuevos' : 'Para hoy', String(fresh.length), fresh, 'new', t));
    if (!pending.length) {
      const e = document.createElement('div');
      e.className = 'empty';
      e.innerHTML = '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#6FD39A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><strong>' + (done.length ? '¡Todo hecho por hoy!' : 'Nada pendiente') + '</strong><span>' + (done.length ? 'Bien ahí.' : 'Anotá abajo lo que no te querés olvidar.') + '</span>';
      main.append(e);
    }
    if (done.length) main.append(section('sec-done', 'Hechos hoy', 'se limpian mañana', done, 'done', t));
  }

  function toggle(id) {
    const it = items.find((i) => i.id === id);
    if (!it) return;
    if (it.doneOn) { it.doneOn = null; it.doneAt = null; }
    else { it.doneOn = today(); it.doneAt = Date.now(); if (navigator.vibrate) navigator.vibrate(12); }
    save(); render();
  }

  $('form').addEventListener('submit', (e) => {
    e.preventDefault();
    const inp = $('nuevo');
    const text = inp.value.trim();
    if (!text) return;
    items.push({ id: Date.now(), text, created: today(), doneOn: null, doneAt: null });
    save(); render();
    inp.value = '';
    inp.focus();
  });

  // ----- Eliminar con triple seguro -----
  const STEPS = [
    { title: (t) => '¿Eliminar “' + t + '”?', txt: 'Vas a borrar esta nota.', no: 'Cancelar', yes: 'Sí, eliminar' },
    { title: () => '¿Seguro?', txt: 'Mirá que no se puede deshacer.', no: 'No', yes: 'Sí, seguro' },
    { title: () => 'Última: ¿segurísimo?', txt: 'Se borra para siempre.', no: 'Mejor no', yes: 'Eliminar' }
  ];
  const cdlg = $('confirm');
  function askDelete(item) {
    let step = 0;
    const draw = () => {
      const s = STEPS[step];
      $('confirmTitle').textContent = s.title(item.text);
      $('confirmTxt').textContent = s.txt;
      cdlg.querySelectorAll('.steps span').forEach((el, i) => el.classList.toggle('on', i <= step));
      const no = document.createElement('button');
      no.type = 'button'; no.className = 'btn'; no.textContent = s.no;
      no.addEventListener('click', () => cdlg.close());
      const yes = document.createElement('button');
      yes.type = 'button'; yes.className = 'btn danger'; yes.textContent = s.yes;
      yes.addEventListener('click', () => {
        if (step < STEPS.length - 1) { step++; draw(); return; }
        items = items.filter((i) => i.id !== item.id);
        save(); render(); cdlg.close(); toast('Nota eliminada');
      });
      // El botón de confirmar cambia de lado en cada paso, para que no se borre de tres toques al pasar
      $('confirmBtns').replaceChildren(...(step % 2 === 0 ? [no, yes] : [yes, no]));
      no.focus();
    };
    draw();
    cdlg.showModal();
  }
  cdlg.addEventListener('click', (e) => { if (e.target === cdlg) cdlg.close(); });

  // ----- Páginas -----
  const pager = $('pager');
  const goTo = (i) => pager.scrollTo({ left: i * pager.clientWidth, behavior: 'smooth' });
  document.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => goTo(Number(b.dataset.go))));
  let raf;
  pager.addEventListener('scroll', () => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const i = Math.round(pager.scrollLeft / pager.clientWidth);
      document.querySelectorAll('.dot').forEach((d, j) => d.setAttribute('aria-current', String(i === j)));
    });
  }, { passive: true });

  // ----- Fondo y transparencia -----
  function applyBg() {
    const data = store.get(BG, '');
    const dim = Number(store.get(DIM, '45'));
    const alpha = Number(store.get(ALPHA, '45'));
    document.documentElement.style.setProperty('--card-a', alpha / 100);
    document.body.classList.toggle('has-bg', !!data);
    $('bg').style.backgroundImage = data ? 'url("' + data + '")' : 'none';
    $('shade').style.opacity = dim / 100;
    $('preview').style.backgroundImage = data ? 'url("' + data + '")' : 'none';
    $('pshade').style.opacity = data ? dim / 100 : 0;
    $('previewTxt').style.display = data ? 'none' : '';
    $('pcard').style.display = data ? '' : 'none';
    $('dim').value = dim;
    $('dimVal').textContent = dim + '%';
    $('alpha').value = alpha;
    $('alphaVal').textContent = alpha + '%';
    $('dim').disabled = !data;
    $('alpha').disabled = !data;
    $('removeBtn').disabled = !data;
  }

  async function useImage(file) {
    if (!file) return;
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      for (const [max, q] of [[1600, 0.82], [1280, 0.75], [960, 0.7], [720, 0.65]]) {
        const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * s);
        c.height = Math.round(img.naturalHeight * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        if (store.set(BG, c.toDataURL('image/jpeg', q))) { applyBg(); toast('Fondo actualizado'); return; }
      }
      toast('No entró la imagen, probá con otra');
    } catch (e) {
      toast('No pude abrir esa imagen');
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  const dlg = $('settings');
  $('openSettings').addEventListener('click', () => { applyBg(); dlg.showModal(); });
  $('closeSettings').addEventListener('click', () => dlg.close());
  dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });
  $('pickBtn').addEventListener('click', () => $('file').click());
  $('file').addEventListener('change', (e) => { useImage(e.target.files[0]); e.target.value = ''; });
  $('removeBtn').addEventListener('click', () => { store.del(BG); applyBg(); toast('Fondo quitado'); });
  $('dim').addEventListener('input', (e) => { store.set(DIM, e.target.value); applyBg(); });
  $('alpha').addEventListener('input', (e) => { store.set(ALPHA, e.target.value); applyBg(); });

  // ----- Toast -----
  let tt;
  function toast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(tt);
    tt = setTimeout(() => el.classList.remove('show'), 2200);
  }

  // El desplegable recuerda si lo dejaste abierto o cerrado (arranca cerrado)
  const fold = $('fold');
  fold.open = store.get('kaishu.fold', '0') === '1';
  fold.addEventListener('toggle', () => store.set('kaishu.fold', fold.open ? '1' : '0'));

  document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

  applyBg();
  render();

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
